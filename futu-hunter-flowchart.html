<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Futu Discussion Hunter — Flowchart</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #f8f9fa; margin: 0; padding: 20px; }
</style>
</head>
<body>
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" style="max-width:1200px">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- TITLE -->
  <text x="600" y="30" font-size="20" font-weight="700" fill="#212529" text-anchor="middle">Futu Discussion Hunter — Multi-Agent Flowchart</text>
  <text x="600" y="50" font-size="12" fill="#868e96" text-anchor="middle">富途讨论区多智能体爬虫架构</text>

  <!-- LEGEND (top right) -->
  <rect x="950" y="60" width="220" height="180" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)"/>
  <text x="960" y="80" font-size="13" font-weight="600" fill="#212529">Legend 图例</text>
  <rect x="960" y="92" width="14" height="14" rx="3" fill="#ffd8a8" stroke="#495057" stroke-width="1"/>
  <text x="980" y="104" font-size="11" fill="#495057">Manual step (用户操作)</text>
  <rect x="960" y="112" width="14" height="14" rx="3" fill="#d0bfff" stroke="#495057" stroke-width="1"/>
  <text x="980" y="124" font-size="11" fill="#495057">Controller / Process</text>
  <rect x="960" y="132" width="14" height="14" rx="3" fill="#a5d8ff" stroke="#495057" stroke-width="1"/>
  <text x="980" y="144" font-size="11" fill="#495057">Parallel Workers</text>
  <rect x="960" y="152" width="14" height="14" rx="3" fill="#c3fae8" stroke="#495057" stroke-width="1"/>
  <text x="980" y="164" font-size="11" fill="#495057">Data / Storage</text>
  <rect x="960" y="172" width="14" height="14" rx="3" fill="#fff3bf" stroke="#495057" stroke-width="1"/>
  <text x="980" y="184" font-size="11" fill="#495057">Filter / Logic</text>
  <rect x="960" y="192" width="14" height="14" rx="3" fill="#b2f2bb" stroke="#495057" stroke-width="1"/>
  <text x="980" y="204" font-size="11" fill="#495057">Output / Result</text>
  <rect x="960" y="212" width="14" height="14" rx="3" fill="#ffc9c9" stroke="#495057" stroke-width="1"/>
  <text x="980" y="224" font-size="11" fill="#495057">Error / Dead Letter</text>

  <!-- STEP 1: Export Cookies -->
  <rect x="50" y="90" width="200" height="75" rx="12" fill="#ffd8a8" stroke="#495057" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="113" font-size="16" font-weight="700" fill="#212529" text-anchor="middle">① Export Cookies</text>
  <text x="150" y="135" font-size="11" text-anchor="middle" fill="#495057">openclaw browser cookies</text>

  <!-- Step 1 command -->
  <rect x="20" y="175" width="260" height="38" rx="6" fill="#e9ecef" stroke="#ced4da" stroke-width="1"/>
  <text x="150" y="197" font-size="12" font-family="Menlo,monospace" text-anchor="middle" fill="#495057">openclaw browser cookies &gt;</text>
  <text x="150" y="210" font-size="12" font-family="Menlo,monospace" text-anchor="middle" fill="#495057">  /tmp/futu_cookies.json</text>

  <!-- Arrow 1→2 -->
  <line x1="150" y1="213" x2="150" y2="245" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- STEP 2: Controller -->
  <rect x="20" y="250" width="260" height="150" rx="12" fill="#d0bfff" stroke="#495057" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="272" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">② CONTROLLER AGENT</text>
  <text x="150" y="290" font-size="11" fill="#868e96" text-anchor="middle">──────────────────────</text>
  <text x="150" y="308" font-size="11" fill="#212529" text-anchor="middle">Spawns 1 worker per stock</text>
  <text x="150" y="323" font-size="11" fill="#212529" text-anchor="middle">(parallel execution)</text>
  <text x="150" y="343" font-size="11" fill="#212529" text-anchor="middle">Polls /tmp/futu_multi/results/</text>
  <text x="150" y="360" font-size="11" fill="#212529" text-anchor="middle">Exponential backoff</text>
  <text x="150" y="375" font-size="11" fill="#c92a2a" text-anchor="middle">10s → 20s → 40s (cap 60s)</text>
  <text x="150" y="395" font-size="11" fill="#212529" text-anchor="middle">Circuit breaker:</text>
  <text x="150" y="410" font-size="11" fill="#c92a2a" text-anchor="middle">3 failures → 10min cooldown</text>

  <!-- Arrows from Controller to Workers (going right) -->
  <line x1="280" y1="295" x2="310" y2="295" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="325" x2="310" y2="325" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="355" x2="310" y2="355" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="385" x2="310" y2="385" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- WORKERS SECTION -->
  <text x="660" y="85" font-size="15" font-weight="700" fill="#495057" text-anchor="middle">SCRAPE WORKERS (parallel)</text>

  <!-- Worker 1: 0992-HK -->
  <rect x="315" y="240" width="150" height="90" rx="10" fill="#a5d8ff" stroke="#495057" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="260" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">Worker 1</text>
  <text x="390" y="277" font-size="11" fill="#868e96" text-anchor="middle">───────────</text>
  <text x="390" y="294" font-size="12" font-weight="600" fill="#1e1e1e" text-anchor="middle">0992-HK 联想</text>
  <text x="390" y="311" font-size="10" fill="#495057" text-anchor="middle">Playwright browser context</text>
  <text x="390" y="326" font-size="10" fill="#495057" text-anchor="middle">60× scroll + 2.5s pause</text>

  <!-- Worker 2: 0700-HK -->
  <rect x="315" y="340" width="150" height="90" rx="10" fill="#a5d8ff" stroke="#495057" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="360" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">Worker 2</text>
  <text x="390" y="377" font-size="11" fill="#868e96" text-anchor="middle">───────────</text>
  <text x="390" y="394" font-size="12" font-weight="600" fill="#1e1e1e" text-anchor="middle">0700-HK 腾讯</text>
  <text x="390" y="411" font-size="10" fill="#495057" text-anchor="middle">Playwright browser context</text>
  <text x="390" y="426" font-size="10" fill="#495057" text-anchor="middle">60× scroll + 2.5s pause</text>

  <!-- Worker 3: 1211-HK -->
  <rect x="480" y="240" width="150" height="90" rx="10" fill="#a5d8ff" stroke="#495057" stroke-width="2" filter="url(#shadow)"/>
  <text x="555" y="260" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">Worker 3</text>
  <text x="555" y="277" font-size="11" fill="#868e96" text-anchor="middle">───────────</text>
  <text x="555" y="294" font-size="12" font-weight="600" fill="#1e1e1e" text-anchor="middle">1211-HK 比亚迪</text>
  <text x="555" y="311" font-size="10" fill="#495057" text-anchor="middle">Playwright browser context</text>
  <text x="555" y="326" font-size="10" fill="#495057" text-anchor="middle">60× scroll + 2.5s pause</text>

  <!-- Worker 4: 9988-HK -->
  <rect x="480" y="340" width="150" height="90" rx="10" fill="#a5d8ff" stroke="#495057" stroke-width="2" filter="url(#shadow)"/>
  <text x="555" y="360" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">Worker 4</text>
  <text x="555" y="377" font-size="11" fill="#868e96" text-anchor="middle">───────────</text>
  <text x="555" y="394" font-size="12" font-weight="600" fill="#1e1e1e" text-anchor="middle">9988-HK 阿里</text>
  <text x="555" y="411" font-size="10" fill="#495057" text-anchor="middle">Playwright browser context</text>
  <text x="555" y="426" font-size="10" fill="#495057" text-anchor="middle">60× scroll + 2.5s pause</text>

  <!-- Worker 5: 02382-HK -->
  <rect x="645" y="240" width="150" height="90" rx="10" fill="#a5d8ff" stroke="#495057" stroke-width="2" filter="url(#shadow)"/>
  <text x="720" y="260" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">Worker 5</text>
  <text x="720" y="277" font-size="11" fill="#868e96" text-anchor="middle">───────────</text>
  <text x="720" y="294" font-size="12" font-weight="600" fill="#1e1e1e" text-anchor="middle">2382-HK 舜宇</text>
  <text x="720" y="311" font-size="10" fill="#495057" text-anchor="middle">Playwright browser context</text>
  <text x="720" y="326" font-size="10" fill="#495057" text-anchor="middle">60× scroll + 2.5s pause</text>

  <!-- Worker 6: 6869-HK -->
  <rect x="645" y="340" width="150" height="90" rx="10" fill="#a5d8ff" stroke="#495057" stroke-width="2" filter="url(#shadow)"/>
  <text x="720" y="360" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">Worker 6</text>
  <text x="720" y="377" font-size="11" fill="#868e96" text-anchor="middle">───────────</text>
  <text x="720" y="394" font-size="12" font-weight="600" fill="#1e1e1e" text-anchor="middle">6869-HK 长飞</text>
  <text x="720" y="411" font-size="10" fill="#495057" text-anchor="middle">Playwright browser context</text>
  <text x="720" y="426" font-size="10" fill="#495057" text-anchor="middle">60× scroll + 2.5s pause</text>

  <!-- Worker 7: 1801-HK -->
  <rect x="810" y="240" width="150" height="90" rx="10" fill="#a5d8ff" stroke="#495057" stroke-width="2" filter="url(#shadow)"/>
  <text x="885" y="260" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">Worker 7</text>
  <text x="885" y="277" font-size="11" fill="#868e96" text-anchor="middle">───────────</text>
  <text x="885" y="294" font-size="12" font-weight="600" fill="#1e1e1e" text-anchor="middle">1801-HK 信达</text>
  <text x="885" y="311" font-size="10" fill="#495057" text-anchor="middle">Playwright browser context</text>
  <text x="885" y="326" font-size="10" fill="#495057" text-anchor="middle">60× scroll + 2.5s pause</text>

  <!-- Worker 8: 3690-HK -->
  <rect x="810" y="340" width="150" height="90" rx="10" fill="#a5d8ff" stroke="#495057" stroke-width="2" filter="url(#shadow)"/>
  <text x="885" y="360" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">Worker 8</text>
  <text x="885" y="377" font-size="11" fill="#868e96" text-anchor="middle">───────────</text>
  <text x="885" y="394" font-size="12" font-weight="600" fill="#1e1e1e" text-anchor="middle">3690-HK 美团</text>
  <text x="885" y="411" font-size="10" fill="#495057" text-anchor="middle">Playwright browser context</text>
  <text x="885" y="426" font-size="10" fill="#495057" text-anchor="middle">60× scroll + 2.5s pause</text>

  <!-- Worker 9: 9992-HK -->
  <rect x="975" y="240" width="150" height="90" rx="10" fill="#a5d8ff" stroke="#495057" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="260" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">Worker 9</text>
  <text x="1050" y="277" font-size="11" fill="#868e96" text-anchor="middle">───────────</text>
  <text x="1050" y="294" font-size="12" font-weight="600" fill="#1e1e1e" text-anchor="middle">9992-HK 泡泡玛特</text>
  <text x="1050" y="311" font-size="10" fill="#495057" text-anchor="middle">Playwright browser context</text>
  <text x="1050" y="326" font-size="10" fill="#495057" text-anchor="middle">60× scroll + 2.5s pause</text>

  <!-- Retry note -->
  <rect x="975" y="350" width="150" height="70" rx="6" fill="#fff3bf" stroke="#495057" stroke-width="1"/>
  <text x="1050" y="368" font-size="10" font-weight="600" text-anchor="middle" fill="#495057">RETRY on:</text>
  <text x="1050" y="381" font-size="10" text-anchor="middle" fill="#495057">timeout, 429, 5xx</text>
  <text x="1050" y="394" font-size="10" text-anchor="middle" fill="#495057">network error</text>
  <text x="1050" y="410" font-size="10" font-weight="600" text-anchor="middle" fill="#c92a2a">NO RETRY: 404, 403</text>

  <!-- Arrow from workers down -->
  <line x1="580" y1="435" x2="580" y2="470" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- STEP 3: Analyze -->
  <rect x="530" y="470" width="100" height="44" rx="10" fill="#d0bfff" stroke="#495057" stroke-width="2" filter="url(#shadow)"/>
  <text x="580" y="493" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">--analyze</text>

  <!-- Arrow down -->
  <line x1="580" y1="514" x2="580" y2="545" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Quality Filter -->
  <rect x="380" y="545" width="400" height="58" rx="10" fill="#fff3bf" stroke="#495057" stroke-width="1" filter="url(#shadow)"/>
  <text x="580" y="565" font-size="13" font-weight="600" fill="#212529" text-anchor="middle">③ Filter: Catalyst + Reasoning Keywords 催化剂关键词</text>
  <text x="580" y="582" font-size="11" text-anchor="middle" fill="#495057">财报 · 政策 · 订单 · 技术突破 · 并购 · 评级上调 · 业绩预喜 · 销量数据</text>
  <text x="580" y="596" font-size="11" text-anchor="middle" fill="#495057">排除：单纯喊目标价、无逻辑支撑、无具体催化剂的帖子</text>

  <!-- Arrow down -->
  <line x1="580" y1="603" x2="580" y2="635" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- OUTPUT -->
  <rect x="350" y="640" width="460" height="115" rx="12" fill="#b2f2bb" stroke="#495057" stroke-width="2" filter="url(#shadow)"/>
  <text x="580" y="662" font-size="14" font-weight="700" fill="#212529" text-anchor="middle">④ OUTPUT — Quality Posts 高质量预测帖</text>
  <text x="580" y="680" font-size="10" fill="#868e96" text-anchor="middle">────────────────────────────────────────────────────────</text>
  <text x="580" y="697" font-size="12" fill="#212529" text-anchor="middle">Stock · User ID · Time · Content snippet · Likes · Profile URL</text>
  <text x="580" y="714" font-size="12" fill="#212529" text-anchor="middle">Profile: https://q.futunn.com/profile/{user_id}</text>
  <text x="580" y="731" font-size="12" fill="#212529" text-anchor="middle">Post URL + Stock community page link</text>
  <text x="580" y="748" font-size="11" fill="#868e96" text-anchor="middle">Saved to: /tmp/futu_multi/results/{trace_id}.json</text>

  <!-- Data Storage Box (below main flow, connecting to output) -->
  <line x1="430" y1="640" x2="430" y2="690" stroke="#495057" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="100" y="480" width="180" height="140" rx="10" fill="#c3fae8" stroke="#495057" stroke-width="1" filter="url(#shadow)"/>
  <text x="190" y="500" font-size="12" font-weight="600" fill="#212529" text-anchor="middle">/tmp/futu_multi/</text>
  <text x="190" y="518" font-size="10" fill="#868e96" text-anchor="middle">├── tasks/          ← pending</text>
  <text x="190" y="533" font-size="10" fill="#868e96" text-anchor="middle">├── results/        ← *.json</text>
  <text x="190" y="548" font-size="10" fill="#868e96" text-anchor="middle">├── dlq/            ← failed</text>
  <text x="190" y="563" font-size="10" fill="#868e96" text-anchor="middle">├── status/         ← heartbeat</text>
  <text x="190" y="578" font-size="10" fill="#868e96" text-anchor="middle">└── progress/      ← partial</text>
  <text x="190" y="598" font-size="10" fill="#868e96" text-anchor="middle">Cookies:</text>
  <text x="190" y="612" font-size="10" font-family="Menlo,monospace" fill="#495057" text-anchor="middle">/tmp/futu_cookies.json</text>

  <!-- Quick Start Box -->
  <rect x="100" y="640" width="240" height="100" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="1" filter="url(#shadow)"/>
  <text x="110" y="660" font-size="12" font-weight="600" fill="#212529">Quick Start 快速上手</text>
  <text x="110" y="676" font-size="10" font-family="Menlo,monospace" fill="#495057">1. openclaw browser cookies</text>
  <text x="110" y="690" font-size="10" font-family="Menlo,monospace" fill="#495057">2. python3 /tmp/futu_multi_agent.py</text>
  <text x="110" y="704" font-size="10" font-family="Menlo,monospace" fill="#495057">   --mode spawn</text>
  <text x="110" y="718" font-size="10" font-family="Menlo,monospace" fill="#495057">3. python3 /tmp/futu_multi_agent.py</text>
  <text x="110" y="732" font-size="10" font-family="Menlo,monospace" fill="#495057">   --analyze</text>
  <text x="110" y="746" font-size="10" font-family="Menlo,monospace" fill="#495057">4. python3 /tmp/futu_multi_agent.py</text>
  <text x="110" y="760" font-size="10" font-family="Menlo,monospace" fill="#495057">   --status</text>

  <!-- Arrow from storage to main flow (subtle) -->
  <line x1="280" y1="590" x2="320" y2="570" stroke="#868e96" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- Circuit Breaker callout -->
  <rect x="20" y="450" width="220" height="70" rx="8" fill="#ffc9c9" stroke="#c92a2a" stroke-width="1" filter="url(#shadow)"/>
  <text x="30" y="468" font-size="11" font-weight="600" fill="#c92a2a">⚠️ Circuit Breaker</text>
  <text x="30" y="484" font-size="10" fill="#495057">After 3 failures per stock:</text>
  <text x="30" y="498" font-size="10" fill="#c92a2a">→ 10 min cooldown</text>
  <text x="30" y="514" font-size="10" fill="#495057">DLQ: Dead Letter Queue</text>

  <!-- Arrow down from circuit breaker to storage -->
  <line x1="130" y1="520" x2="130" y2="580" stroke="#c92a2a" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Mode selector callout -->
  <rect x="310" y="470" width="100" height="44" rx="6" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
  <text x="360" y="485" font-size="9" font-weight="600" fill="#495057" text-anchor="middle">Mode A: spawn</text>
  <text x="360" y="498" font-size="9" fill="#495057" text-anchor="middle">Mode B: queue</text>

</svg>
</body>
</html>
